name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Enforce replay coverage floor
        run: go run ./tools/replaycoverage
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files -- '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  api-compatibility:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PUBLIC_MODULE: github.com/portpowered/go-tplink
      PUBLIC_PACKAGES: 'pkg/tplink,pkg/tplinkmodels'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Report public API compatibility
        run: go run ./tools/compatibility -policy report -base "$COMPAT_BASE" -module "$PUBLIC_MODULE" -packages "$PUBLIC_PACKAGES"
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Create replay coverage profile
        run: go test -count=1 -covermode=set -coverpkg=github.com/portpowered/go-tplink/pkg/tplink -coverprofile=coverage.replay.out ./tests/replay
      - name: Publish replay coverage badge and report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ncruces/go-coverage-report@dfc237255099f2d25066babde51253992175e365 # v0.3.2
        with:
          coverage-file: coverage.replay.out
          badge-title: replay coverage
          report: true
          chart: true
          amend: true
