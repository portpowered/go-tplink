name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Lint with all linters (golangci-lint v2.14.0)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: ./...
  cli-lint:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cmd/go-tplink/go.mod
          cache: true
      - name: Lint standalone CLI with all linters (golangci-lint v2.14.0)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: cmd/go-tplink
          args: --config .golangci.yml --allow-parallel-runners ./...
  cli-verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build standalone CLI
        run: go build ./...
        working-directory: cmd/go-tplink
      - name: Test standalone CLI
        run: go test -race ./...
        working-directory: cmd/go-tplink
      - name: Vet standalone CLI
        run: go vet ./...
        working-directory: cmd/go-tplink
      - name: Check CLI formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l *.go)"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
        working-directory: cmd/go-tplink
      - name: Check CLI module metadata
        run: go mod tidy
        working-directory: cmd/go-tplink
      - name: Ensure CLI module metadata is tidy
        run: git diff --exit-code -- cmd/go-tplink/go.mod cmd/go-tplink/go.sum
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.24.x', '1.26.x']
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build ./...
      - name: Test
        run: go test -race ./...
      - name: Enforce replay coverage floor
        run: go run ./tools/replaycoverage
      - name: Enforce schema-backed wire payload inventory
        run: go run ./tools/wireinventory
      - name: Vet
        run: go vet ./...
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l $(git ls-files -- '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Unformatted Go files:"
            echo "$unformatted"
            exit 1
          fi
      - name: Check module metadata
        shell: bash
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
  api-compatibility:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
      COMPAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
      PUBLIC_MODULE: github.com/portpowered/go-tplink
      PUBLIC_PACKAGES: 'pkg/tplink,pkg/tplinkmodels'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Report public API compatibility
        run: go run ./tools/compatibility -policy report -base "$COMPAT_BASE" -module "$PUBLIC_MODULE" -packages "$PUBLIC_PACKAGES"

  schema-generation:
    runs-on: ubuntu-latest
    env:
      GOWORK: 'off'
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Regenerate API models
        run: make generate-api
      - name: Check generated models
        run: git diff --exit-code -- pkg/dependencymodels pkg/generatedwire pkg/tplink/constants.gen.go pkg/tplinkmodels
