version: "2"

linters:
  default: all

  settings:
    depguard:
      rules:
        Main:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/*.gen.go"
            - "!**/tools/schemaexamples/**"
          allow:
            - $gostd
            - github.com/portpowered/go-tplink
            - gopkg.in/yaml.v3

        Tests:
          list-mode: strict
          files:
            - $test
            - "!**/tools/schemaexamples/**"
          allow:
            - $gostd
            - github.com/portpowered/go-tplink
            - github.com/stretchr/testify
            - gopkg.in/yaml.v3

        Generated:
          list-mode: strict
          files:
            - "**/*.gen.go"
          allow:
            - $gostd
            - github.com/portpowered/go-tplink
            - github.com/oapi-codegen/runtime

        SchemaExamples:
          list-mode: strict
          files:
            - "**/tools/schemaexamples/**"
          allow:
            - $gostd
            - github.com/santhosh-tekuri/jsonschema/v6
            - gopkg.in/yaml.v3
    forbidigo:
      # Command-line examples and tools intentionally write formatted output.
      # Keep the built-in debug print functions forbidden.
      forbid:
        - pattern: ^print(ln)?$
