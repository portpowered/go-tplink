openapi: 3.1.0
info:
  title: TP-Link Kasa Cloud API (go-tplink wire contract)
  version: 0.1.0
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  description: |
    Implementation-derived documentation for the cloud request and response shapes used by go-tplink.

    Evidence caveat: this contract is based on the current client implementation and synthetic offline replay fixtures. The fixtures have no verifiable capture provenance. This document is not vendor-issued and has not been verified against live captures; device, account, region, and firmware behavior may vary.
servers:
  - url: https://use1-wap.tplinkcloud.com
    description: Default base URL embedded in go-tplink.
    x-go-compat-constant-name: BaseURLUS
    x-go-default-base-url-constant-name: DefaultBaseURL
  - url: https://eu-wap.tplinkcloud.com
    description: Regional base URL constant embedded in go-tplink.
    x-go-compat-constant-name: BaseURLEU
  - url: https://aps1-wap.tplinkcloud.com
    description: Regional base URL constant embedded in go-tplink.
    x-go-compat-constant-name: BaseURLAsiaPacific
  - url: https://wap.tplinkcloud.com
    description: Global base URL constant embedded in go-tplink.
    x-go-compat-constant-name: BaseURLGlobal
tags:
  - name: Cloud request
    description: All implemented operations use this single cloud request endpoint.
paths:
  /:
    post:
      tags:
        - Cloud request
      security: []
      operationId: sendCloudRequest
      x-go-wire-method-constant-name: CloudRequestHTTPMethod
      x-go-wire-path-constant-name: CloudRequestPath
      summary: Dispatch a cloud method
      description: >-
        All implemented cloud methods use this POST route. The method field
        selects login, device enumeration, or passthrough. This contract is
        implementation-derived from the current client and synthetic offline
        replay fixtures; it is not vendor-issued or verified against live
        captures. See the Guides in the sidebar for client operations, inputs,
        and decoded payloads.
      parameters:
        - name: token
          in: query
          required: false
          x-go-wire-constant-name: TokenQueryKey
          description: |
            Session token. Omit for login; the client requires it for getDeviceList and passthrough.
          schema:
            type: string
            example: synthetic-session-token
            x-example-evidence: synthetic
      requestBody:
        required: true
        description: One method-specific JSON envelope per request.
        x-go-wire-content-type-header-constant-name: CloudRequestContentTypeHeader
        x-go-wire-content-type-header: Content-Type
        content:
          application/json:
            x-go-wire-constant-name: CloudRequestContentType
            schema:
              $ref: '#/components/schemas/CloudRequest'
            examples:
              login:
                summary: Login request (synthetic example)
                x-example-evidence: synthetic
                value:
                  method: login
                  params:
                    appType: Tapo_Android
                    cloudUserName: user@example.test
                    cloudPassword: placeholder-password
                    terminalUUID: go-tplink-client
              getDeviceList:
                summary: Device-list request (synthetic example)
                x-example-evidence: synthetic
                value:
                  method: getDeviceList
              turnOn:
                summary: Turn a plug on
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-plug-id
                    requestData: '{"system":{"set_relay_state":{"state":1}}}'
              turnOff:
                summary: Turn a plug off
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-plug-id
                    requestData: '{"system":{"set_relay_state":{"state":0}}}'
              getPowerState:
                summary: Read plug system information
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-plug-id
                    requestData: '{"system":{"get_sysinfo":""}}'
              reboot:
                summary: Reboot a plug
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-plug-id
                    requestData: '{"system":{"reboot":{"delay":1}}}'
              setAlias:
                summary: Set a device alias
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-device-id
                    requestData: '{"system":{"set_dev_alias":{"alias":"Desk Plug"}}}'
              getLightState:
                summary: Read bulb light state
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-bulb-id
                    requestData: '{"smartlife.iot.smartbulb.lightingservice":{"get_light_state":""}}'
              setBrightness:
                summary: Set bulb brightness
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-bulb-id
                    requestData: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"brightness":50}}}'
              setColorTemp:
                summary: Set bulb color temperature
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-bulb-id
                    requestData: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"color_temp":4000}}}'
              setColor:
                summary: Set bulb hue and saturation
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-bulb-id
                    requestData: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"hue":240,"saturation":80}}}'
              setLightState:
                summary: Set multiple bulb state fields
                x-example-evidence: synthetic
                value:
                  method: passthrough
                  params:
                    deviceId: example-bulb-id
                    requestData: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"on_off":1,"brightness":75,"hue":120,"saturation":50}}}'
      responses:
        '200':
          description: |
            Cloud response envelope. Cloud-level failures may also use this HTTP status and are represented by a non-zero error_code.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloudResponseEnvelope'
              examples:
                loginSuccess:
                  summary: Successful login response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      accountId: example-account-id
                      token: synthetic-session-token
                      email: user@example.test
                      regTime: '2020-01-01 00:00:00'
                      countryCode: US
                deviceListSuccess:
                  summary: Device-list response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      deviceList:
                        - deviceType: IOT.SMARTPLUGSWITCH
                          deviceId: example-plug-id
                          alias: Desk Plug
                          deviceModel: HS105(US)
                          deviceMac: AABBCCDDEEFF
                          fwVer: 1.5.6
                          deviceHwVer: '2.1'
                          hwId: example-hardware-id
                          fwId: example-firmware-id
                          oemId: example-oem-id
                          appServerUrl: https://use1-wap.tplinkcloud.com
                          deviceRegion: us-east-1
                          status: 1
                          isSameRegion: true
                        - deviceType: IOT.SMARTBULB
                          deviceId: example-bulb-id
                          alias: Hall Bulb
                          deviceModel: LB130
                          is_dimmable: 1
                          is_color: 1
                          is_variable_color_temp: 1
                        - deviceType: IOT.RANGEEXTENDER.SMARTPLUG
                          deviceId: example-range-extender-plug-id
                          alias: Workshop Plug
                          deviceModel: RE270K
                        - deviceType: IOT.FUTURE.DEVICE
                          deviceId: example-other-id
                          alias: New Device Type
                emptyDeviceList:
                  summary: Empty device list (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      deviceList: []
                passthroughSuccess:
                  summary: Passthrough response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"system":{"set_relay_state":{"err_code":0}}}'
                plugStateSuccess:
                  summary: Plug system-information response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"system":{"get_sysinfo":{"sw_ver":"1.5.6 Build 191125 Rel.083657","hw_ver":"2.1","model":"HS105(US)","deviceId":"example-plug-id","alias":"Desk Plug","relay_state":1,"on_time":3600,"err_code":0}}}'
                plugCommandSuccess:
                  summary: Plug command acknowledgement (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"system":{"set_relay_state":{"err_code":0}}}'
                rebootSuccess:
                  summary: Plug reboot acknowledgement (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"system":{"reboot":{"err_code":0}}}'
                aliasSuccess:
                  summary: Device alias update acknowledgement (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"system":{"set_dev_alias":{"err_code":0}}}'
                bulbStateSuccess:
                  summary: Bulb light-state response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"smartlife.iot.smartbulb.lightingservice":{"get_light_state":{"on_off":1,"brightness":75,"hue":240,"saturation":80,"color_temp":0,"mode":"normal","err_code":0}}}'
                bulbCommandSuccess:
                  summary: Bulb state-update acknowledgement (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"smartlife.iot.smartbulb.lightingservice":{"transition_light_state":{"err_code":0}}}'
                cloudError:
                  summary: Expired-token error (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: -20651
                    msg: Token expired
                loginError:
                  summary: Login authentication error (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: -20601
                    msg: Incorrect email or password
                rateLimitError:
                  summary: Rate-limit error (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: -20004
                    msg: Rate limit exceeded
                parameterError:
                  summary: Cloud parameter error (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: -20104
                    msg: Bad request or parameter error
                deviceListError:
                  summary: Device-command failure inside a cloud response (synthetic shape)
                  x-example-evidence: synthetic
                  value:
                    error_code: 0
                    result:
                      responseData: '{"err_code":-1,"err_msg":"module not support"}'
        '4XX':
          description: Non-2xx HTTP response. The client reports the HTTP status and does not decode the body as a cloud envelope.
        '5XX':
          description: Non-2xx HTTP response. The client reports the HTTP status and does not decode the body as a cloud envelope.
        default:
          description: Non-2xx HTTP response. The client reports the HTTP status and does not decode this response as a cloud envelope.
components:
  schemas:
    CloudRequest:
      $ref: './cloud-envelope.openapi.yaml#/components/schemas/CloudRequest'
    LoginCloudRequest:
      $ref: './authentication.openapi.yaml#/components/schemas/LoginCloudRequest'
    GetDeviceListCloudRequest:
      $ref: './devices.openapi.yaml#/components/schemas/GetDeviceListCloudRequest'
    PassthroughCloudRequest:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughCloudRequest'
    LoginParams:
      $ref: './authentication.openapi.yaml#/components/schemas/LoginParams'
    PassthroughParams:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughParams'
    PassthroughCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughCommand'
    SystemGetSysInfoCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/SystemGetSysInfoCommand'
    SystemSetRelayStateCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/SystemSetRelayStateCommand'
    SystemRebootCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/SystemRebootCommand'
    SystemSetDevAliasCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/SystemSetDevAliasCommand'
    LightingGetLightStateCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/LightingGetLightStateCommand'
    LightingTransitionLightStateCommand:
      $ref: './passthrough.openapi.yaml#/components/schemas/LightingTransitionLightStateCommand'
    LightTransitionState:
      $ref: './passthrough.openapi.yaml#/components/schemas/LightTransitionState'
    CloudResponseEnvelope:
      $ref: './cloud-envelope.openapi.yaml#/components/schemas/CloudResponseEnvelope'
    CloudResponse:
      $ref: './cloud-envelope.openapi.yaml#/components/schemas/CloudResponse'
    CloudErrorResponse:
      $ref: './cloud-envelope.openapi.yaml#/components/schemas/CloudErrorResponse'
    LoginResponse:
      $ref: './authentication.openapi.yaml#/components/schemas/LoginResponse'
    LoginResult:
      $ref: './authentication.openapi.yaml#/components/schemas/LoginResult'
    DeviceListResponse:
      $ref: './devices.openapi.yaml#/components/schemas/DeviceListResponse'
    DeviceListResult:
      $ref: './devices.openapi.yaml#/components/schemas/DeviceListResult'
    Device:
      $ref: './devices.openapi.yaml#/components/schemas/Device'
    PassthroughResponse:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughResponse'
    PassthroughResult:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughResult'
    PassthroughCommandResult:
      $ref: './passthrough.openapi.yaml#/components/schemas/PassthroughCommandResult'
    SystemCommandResult:
      $ref: './passthrough.openapi.yaml#/components/schemas/SystemCommandResult'
    LightingCommandResult:
      $ref: './passthrough.openapi.yaml#/components/schemas/LightingCommandResult'
    CommandAcknowledgement:
      $ref: './passthrough.openapi.yaml#/components/schemas/CommandAcknowledgement'
    DeviceCommandError:
      $ref: './passthrough.openapi.yaml#/components/schemas/DeviceCommandError'
    SysInfo:
      $ref: './passthrough.openapi.yaml#/components/schemas/SysInfo'
    LightState:
      $ref: './passthrough.openapi.yaml#/components/schemas/LightState'
